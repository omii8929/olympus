services:
  - type: web
    name: olympus-backend-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5050
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: olympus-db
          property: connectionString

databases:
  - name: olympus-db
    plan: free
    region: singapore
